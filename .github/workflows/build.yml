name: Build Geode Mod

on:
  workflow_dispatch:
    inputs:
      release_description:
        description: 'Description for the gh release'
        required: false
        default: ''
        type: string
  push:
    branches:
      - "**"
    

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          zst: true
          optimize-pngs: true

      - uses: actions/upload-artifact@v5
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Extract version from .geode
        if: github.event_name == 'workflow_dispatch'
        id: get_version
        run: |
          BUILD_DIR="${{ steps.build.outputs.build-output }}"
          GEODE_FILE=$(find "$BUILD_DIR" -maxdepth 2 -name '*.geode' | head -n 1)
          if [ -z "$GEODE_FILE" ]; then
            echo "no .geode file found in $BUILD_DIR" >&2
            exit 1
          fi
          echo "found geode file: $GEODE_FILE"
          mkdir -p /tmp/geode_extract
          unzip -o "$GEODE_FILE" mod.json -d /tmp/geode_extract >/dev/null
          if [ ! -f /tmp/geode_extract/mod.json ]; then
            echo "incase im detecting it wrongly: no mod.json" >&2
            exit 1
          fi
          VERSION=$(jq -r '.version' /tmp/geode_extract/mod.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "could not read version from mod.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "geode_file=$GEODE_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: ${{ inputs.release_description }}
          files: ${{ steps.get_version.outputs.geode_file }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
